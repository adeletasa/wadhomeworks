
name: Deploy Vue to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: homework3/package-lock.json

      - name: Install dependencies
        working-directory: homework3
        run: npm ci

      - name: Build Vue app
        working-directory: homework3
        run: npm run build -- --base=/wadhomeworks/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: homework3/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
